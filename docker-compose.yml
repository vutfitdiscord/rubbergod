services:
    db:
        image: postgres:16-alpine
        container_name: rubbergod-postgres
        deploy:
            restart_policy:
                condition: unless-stopped
                delay: 5s
                window: 20s
        environment:
            POSTGRES_USER: rubbergod
            POSTGRES_DB: rubbergod
            POSTGRES_HOST_AUTH_METHOD: "trust"
        command: ["postgres", "-c", "logging_collector=on", "-c", "log_directory=/var/log/", "-c", "log_filename=postgresql.log", "-c", "log_file_mode=0644", "-c", "log_rotation_size=200MB"]
        volumes:
            - ./logs:/var/log:z
            - postgres_data:/var/lib/postgresql/data/
            - ./database/backup/backup.sql:/docker-entrypoint-initdb.d/backup.sql
        networks:
            - postgres
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rubbergod -d rubbergod"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s

    bot:
        image: rubbergod-bot
        container_name: rubbergod-bot
        deploy:
            restart_policy:
                condition: unless-stopped
                delay: 5s
                window: 20s
        build:
            context: .
            dockerfile: Dockerfile
            tags:
                - rubbergod-bot
        volumes:
            - .:/rubbergod:z
            - ssh_config:/root/.ssh
        depends_on:
            db:
                condition: service_healthy
        networks:
            - postgres
            - prometheus
            - nasa_api
        healthcheck:
            test: ["CMD", "python3", "healthcheck.py"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    nasa-api:
        image: ghcr.io/vutfitdiscord/apod-api:latest
        container_name: nasa-api
        deploy:
            restart_policy:
                condition: unless-stopped
                delay: 5s
                window: 20s
        networks:
            - nasa_api
        healthcheck:
            test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s


volumes:
    postgres_data:
    ssh_config:

networks:
    postgres:
    nasa_api:
    prometheus:
        external: true
