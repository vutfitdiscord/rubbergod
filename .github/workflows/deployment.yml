name: Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check_deployment:
    runs-on: ubuntu-latest
    steps:
    - name: Check PR has no-deployment label
      id: check_deployment
      uses: actions/github-script@v9
      timeout-minutes: 5
      with:
        script: |
          const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
          });
          const labels = prs.flatMap(pr => pr.labels.map(label => label.name));
          return labels.includes('no-deployment');
    outputs:
      deploy: "${{ ! fromJson(steps.check_deployment.outputs.result) }}"

  pre_commit_ci:
    uses: vutfitdiscord/rubbergod/.github/workflows/lint.yml@main

  deployment_production:
    runs-on: ubuntu-latest
    environment: Production
    needs: [pre_commit_ci, check_deployment]
    if: github.ref == 'refs/heads/main' && needs.check_deployment.outputs.deploy == 'true'
    steps:
      - name: Execute deployment on SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          port: 22
          script: |

            # Fail on non-zero exit code
            set -e

            echo "================== Lock Mutex =================="
            LOCK="/tmp/deployment.lock"

            remove_lock()
            {
                rm -f "$LOCK"
            }

            acquire_failed()
            {
                echo "Failed to acquire lock, perphaps a stale deployment is running requiring manual fix?"
                exit 1
            }

            # !IMPORTANT: For this to work, the remote server has to have `procmail` installed.
            # Try to lock 5 times with a 60s sleep time between retries
            # Remove any lock older than 10min (600s) and then wait 30s
            lockfile -60 -r 5 -l 600 -s 30 "$LOCK" || acquire_failed

            # Remove lock on exit
            trap remove_lock EXIT

            echo "================== Pull Changes =================="
            cd ${{ vars.PRODUCTION_PATH }}
            git pull

            echo "================== Build Image =================="
            docker build . --tag rubbergod-bot

            echo "================== Restart Services =================="
            docker compose down
            if ! docker compose up -d --wait --wait-timeout 120; then
                echo "Failed to start services or services failed health checks!"
                docker compose ps
                docker compose logs --tail 50
                exit 1
            fi

            echo "================== Check Services Health =================="
            docker compose ps
            for id in $(docker compose ps --all -q); do
                name=$(docker inspect --format '{{.Name}}' "$id")
                health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$id")
                running=$(docker inspect --format '{{.State.Running}}' "$id")
                echo "Container $name (running: $running, health: $health)"
                if [ "$running" != "true" ] || { [ "$health" != "none" ] && [ "$health" != "healthy" ]; }; then
                    echo "Error: Container $name is not healthy/running!"
                    docker compose logs --tail 50
                    exit 1
                fi
            done

            echo "================== Clean Up Images =================="
            echo "y" | docker image prune -a
